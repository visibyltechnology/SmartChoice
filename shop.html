olor:#071b4a}.btn{background:#e51d3e;color:white;border:0;border-radius:7px;padding:10px 12px;font-weight:700;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:40px}.detail-link{color:#071b4a;font-weight:700;text-decoration:none;font-size:13px;margin-left:9px}.card{background:#fff;border:1px solid #edf0f5;border-radius:12px;padding:12px;box-shadow:0 2px 9px rgba(7,27,74,.045)}.card h3{font-size:15px;line-height:1.35;min-height:40px}.card img{object-fit:cover}.panel{background:white;padding:20px;border-radius:12px;margin:15px 0}.field{width:100%;padding:13px;border:1px solid #d5dae4;border-radius:7px;margin:8px 0}footer{background:#071b4a;color:#dce6f8;padding:22px;margin-top:35px}footer a{color:white}@media(max-width:760px){.shop-layout{grid-template-columns:1fr}.shop-sidebar{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card img{height:145px}.shop-tools{align-items:stretch;flex-direction:column}.shop-tools .field{max-width:none}.shop-hero{padding:21px}}@media(min-width:761px) and (max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.shop-layout{grid-template-columns:190px minmax(0,1fr)}}
</style><title>Shop All Products | Smart Choice</title></head><body><header><a href="/" aria-label="Smart Choice home"><img src="/logo.svg" alt="Smart Choice Electronics Group" style="width:190px;max-width:55vw;height:auto;vertical-align:middle"></a><a href="/shop.html">Shop All</a><a href="/showrooms.html">Our Showrooms</a><a href="/track-order.html">Track Order</a></header><main class="wrap"><section class="shop-hero"><h1>Discover the Smart Choice Store</h1><p>Shop electronics, home appliances, kitchen essentials, power solutions and furniture. Quality choices for your home and business.</p></section><nav class="shop-cats" id="catChips"></nav><div class="shop-tools"><input id="q" class="field" placeholder="Search products, brands and categories..." oninput="render()"><select id="sort" class="field" onchange="render()" style="max-width:220px"><option value="featured">Sort: Featured</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option><option value="az">Name: A to Z</option></select></div><div class="shop-layout"><aside class="shop-sidebar"><b>Shop by Category</b><div id="sideCats"></div></aside><section><div class="shop-results" id="resultCount"></div><div id="grid" class="grid"></div></section></div></main><footer>Smart Choice Electronics Group · Port Harcourt, Rivers State · <a href="mailto:smartchoiceglobalresourcesltd@gmail.com">Contact us</a></footer><script>
const P=[["Hisense 55-inch QLED 4K Smart TV","Televisions","https://images.unsplash.com/photo-1593359677879-a4bb92f829d1?w=650","₦620,000"],["TCL 50-inch 4K UHD Smart TV","Televisions","https://images.unsplash.com/photo-1593784991095-a205069470b6?w=650","₦480,000"],["Samsung 65-inch Crystal UHD TV","Televisions","https://images.unsplash.com/photo-1461151304267-38535e780c79?w=650","₦890,000"],["Double Door Frost-Free Refrigerator","Refrigerators","https://images.unsplash.com/photo-1571175443880-49e1d25b2bc5?w=650","₦780,000"],["Bottom Freezer Refrigerator","Refrigerators","https://images.unsplash.com/photo-1584568694244-14fbdf83bd30?w=650","₦650,000"],["Side-by-Side Refrigerator","Refrigerators","https://images.unsplash.com/photo-1600508774634-4e11d34730e2?w=650","₦1,150,000"],["Chest Freezer 300L","Freezers","https://images.unsplash.com/photo-1584568694244-14fbdf83bd30?w=650","₦360,000"],["Chest Freezer 500L","Freezers","https://images.unsplash.com/photo-1571175443880-49e1d25b2bc5?w=650","₦590,000"],["Inverter Split Air Conditioner","Air Conditioners","https://images.unsplash.com/photo-1631545806609-8e6f4b7b8c5b?w=650","₦545,000"],["1.5HP Split Air Conditioner","Air Conditioners","https://images.unsplash.com/photo-1631545806609-8e6f4b7b8c5b?w=650","₦495,000"],["Front Load Washing Machine","Washing Machines","https://images.unsplash.com/photo-1626806787461-102c1bfaaea1?w=650","₦450,000"],["Automatic Top Load Washer","Washing Machines","https://images.unsplash.com/photo-1626806787461-102c1bfaaea1?w=650","₦330,000"],["Electric Blender & Food Processor","Kitchen Appliances","https://images.unsplash.com/photo-1570222094114-d054a817e56b?w=650","₦95,000"],["Air Fryer & Multi-Cooker","Kitchen Appliances","https://images.unsplash.com/photo-1585515320310-259814833e62?w=650","₦135,000"],["Microwave Oven","Kitchen Appliances","https://images.unsplash.com/photo-1585659722983-3a675dabf23d?w=650","₦185,000"],["Firman Hybrid Inverter System","Inverters & Power","https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?w=650","Request a quote"],["ECOFLOW Portable Power Station","Inverters & Power","https://images.unsplash.com/photo-1509391366360-2e959784a276?w=650","Request a quote"],["Solar Inverter & Battery Package","Inverters & Power","https://images.unsplash.com/photo-1509391366360-2e959784a276?w=650","Request a quote"],["Modern Living Room Sofa Set","Modern Furniture","https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=650","Request a quote"],["Contemporary Dining Set","Modern Furniture","https://images.unsplash.com/photo-1617806118233-18e1de247200?w=650","Request a quote"],["Modern Bedroom Furniture","Modern Furniture","https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=650","Request a quote"],["Home & General Merchandise","General Merchandise","https://images.unsplash.com/photo-1556228720-195a672e8a03?w=650","Contact for price"]];
function addToCart(i){const p=P[i],price=Number(String(p[3]).replace(/[^0-9]/g,''));if(!price){alert('Please contact the showroom for the current price and availability of this item.');return}let cart=JSON.parse(localStorage.getItem('sc_cart')||'[]');let item=cart.find(x=>x.name===p[0]);if(item)item.qty+=1;else cart.push({name:p[0],category:p[1],price,qty:1,image:p[2]});localStorage.setItem('sc_cart',JSON.stringify(cart));const b=document.getElementById('add-'+i);if(b){b.textContent='Added ✓';setTimeout(()=>b.textContent='Add to Cart',1300)}}let activeCategory='All';const categories=['All',...new Set(P.map(p=>p[1]))];document.getElementById('catChips').innerHTML=categories.map(x=>'<button class="'+(x==='All'?'active':'')+'" onclick="chooseCategory(\''+x+'\')">'+x+'</button>').join('');document.getElementById('sideCats').innerHTML=categories.map(x=>'<button onclick="chooseCategory(\''+x+'\')">'+x+'</button>').join('');function chooseCategory(x){activeCategory=x;document.querySelectorAll('#catChips button').forEach(b=>b.classList.toggle('active',b.textContent===x));render()}function render(){let q=document.getElementById('q').value.toLowerCase().trim();let matches=P.map((p,i)=>({p,i})).filter(x=>(activeCategory==='All'||x.p[1]===activeCategory)&&x.p.join(' ').toLowerCase().includes(q));let sort=document.getElementById('sort').value;if(sort==='low')matches.sort((a,b)=>(Number(a.p[3].replace(/[^0-9]/g,''))||Infinity)-(Number(b.p[3].replace(/[^0-9]/g,''))||Infinity));if(sort==='high')matches.sort((a,b)=>(Number(b.p[3].replace(/[^0-9]/g,''))||0)-(Number(a.p[3].replace(/[^0-9]/g,''))||0));if(sort==='az')matches.sort((a,b)=>a.p[0].localeCompare(b.p[0]));document.getElementById('resultCount').textContent=matches.length+' products';document.getElementById('grid').innerHTML=matches.map(({p,i})=>'<article class="card"><a href="/product.html?id='+i+'&from=shop"><img loading="lazy" src="'+p[2]+'" alt="'+p[0]+'" onerror="this.style.display=\'none\'"></a><h3><a style="color:#071b4a;text-decoration:none" href="/product.html?id='+i+'&from=shop">'+p[0]+'</a></h3><p class="muted">'+p[1]+'</p><p class="price">'+p[3]+'</p><button class="btn" id="add-'+i+'" onclick="addToCart('+i+')">Add to Cart</button><a class="detail-link" href="/product.html?id='+i+'&from=shop">View Details</a></article>').join('')||'<p>No products match your search.</p>'}render();</script></body></html>
