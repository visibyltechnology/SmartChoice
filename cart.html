<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Cart | Smart Choice</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172238;font:15px Arial}header{background:#fff;padding:14px 18px;border-bottom:1px solid #e7eaf0;display:flex;justify-content:space-between;align-items:center}a{color:#071b4a;text-decoration:none;font-weight:700}.brand{font-size:18px;font-weight:900;color:#071b4a}.brand span{color:#e51d3e}.wrap{max-width:850px;margin:25px auto;padding:0 16px}.panel{background:#fff;border-radius:14px;padding:20px;margin:15px 0;box-shadow:0 4px 16px #071b4a0b}.line{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #edf0f4;padding:13px 0}.btn{display:inline-block;background:#e51d3e;color:white;padding:13px 18px;border-radius:8px;border:0;font-weight:800}.remove{background:#fff;border:1px solid #e51d3e;color:#e51d3e;border-radius:7px;padding:8px 11px}footer{background:#071b4a;color:#fff;padding:22px;text-align:center;margin-top:35px}</style></head><body><header><a class="brand" href="/">Smart<span>Choice</span></a><a href="/shop.html">Continue Shopping</a></header><main class="wrap"><h1>Your Shopping Cart</h1><div id="items" class="panel"></div><div id="total" class="panel"></div></main><footer>Smart Choice Electronics Group · Port Harcourt</footer><script>const fmt=n=>'₦'+Number(n).toLocaleString('en-NG');function getCart(){try{return JSON.parse(localStorage.getItem('sc_cart')||'[]')}catch(e){return []}}function load(){const c=getCart(),items=document.getElementById('items'),total=document.getElementById('total');if(!c.length){items.innerHTML='<p>Your cart is currently empty.</p><a href="/shop.html">Continue shopping →</a>';total.innerHTML='';return}items.innerHTML=c.map((x,i)=>'<div class="line"><div><b>'+x.name+'</b><p>'+x.category+'</p>'+fmt(x.price)+' × '+x.qty+'</div><button class="remove" onclick="removeItem('+i+')">Remove</button></div>').join('');const sum=c.reduce((s,x)=>s+(Number(x.price)||0)*(Number(x.qty)||1),0);total.innerHTML='<h2>Order subtotal: '+fmt(sum)+'</h2><a class="btn" href="/checkout.html">Proceed to Checkout</a>'}function removeItem(i){const c=getCart();c.splice(i,1);localStorage.setItem('sc_cart',JSON.stringify(c));load()}load();</script></body></html>
