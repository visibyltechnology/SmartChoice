<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#182238;font:15px Arial}header{background:#071b4a;color:#fff;padding:15px}header a{color:#fff;text-decoration:none;font-weight:bold;margin-right:15px}.wrap{max-width:850px;margin:25px auto;padding:0 16px}h1,h2{color:#071b4a}.panel{background:white;border-radius:12px;padding:20px;margin:15px 0}.muted{color:#667085;line-height:1.6}.field{width:100%;padding:12px;border:1px solid #d5dae4;border-radius:7px;margin:8px 0}.btn{background:#e51d3e;color:#fff;border:0;border-radius:7px;padding:12px 16px;font-weight:bold;display:inline-block;text-decoration:none}.choice{display:block;padding:14px;border:1px solid #dce1e9;border-radius:8px;margin:9px 0}.bank{background:#f5f7fb;padding:13px;border-radius:8px;margin:10px 0}footer{background:#071b4a;color:#fff;padding:22px;margin-top:30px}small{color:#667085}<title>Your Cart | Smart Choice</title></head><body><header><a href="/" aria-label="Smart Choice home"><img src="/logo.svg" alt="Smart Choice Electronics Group" style="width:190px;max-width:55vw;height:auto;vertical-align:middle"></a>　<a href="/shop.html">Continue Shopping</a></header><main class="wrap"><h1>Your Shopping Cart</h1><div id="items" class="panel"></div><div id="total" class="panel"></div></main><footer>Smart Choice Electronics Group · Port Harcourt only</footer><script>
const fmt=n=>'₦'+Number(n).toLocaleString('en-NG');function load(){let c=JSON.parse(localStorage.getItem('sc_cart')||'[]');document.getElementById('items').innerHTML=c.length?c.map((x,i)=>'<div style="display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:12px 0"><div><b>'+x.name+'</b><p>'+x.category+'</p>'+fmt(x.price)+' × '+x.qty+'</div><button onclick="removeItem('+i+')">Remove</button></div>').join(''):'Your cart is empty. <a href="/shop.html">Shop products</a>';let t=c.reduce((s,x)=>s+x.price*x.qty,0);document.getElementById('total').innerHTML=c.length?'<h2>Subtotal: '+fmt(t)+'</h2><button class="btn" onclick="document.getElementById(\'pay\').style.display=\'block\'">Proceed to Checkout</button>':''}function removeItem(i){let c=JSON.parse(localStorage.getItem('sc_cart')||'[]');c.splice(i,1);localStorage.setItem('sc_cart',JSON.stringify(c));load()}function continuePayment(){let m=document.querySelector('input[name=method]:checked').value;let c=JSON.parse(localStorage.getItem('sc_cart')||'[]');if(m==='save'){location.href='/save-to-buy.html?product='+encodeURIComponent(c[0]?.name||'');return}if(m==='klump'){document.getElementById('message').textContent='Klump checkout cannot be activated until the merchant API credentials and production integration are configured. Please use Pay Now or contact the showroom.';return}document.getElementById('message').innerHTML='<h3>Pay by bank transfer</h3><div class="bank"><b>SMART CHOICE GLOBAL RESOURCES LTD</b><br>Moniepoint MFB<br>Account: <b id="acc1">5240879532</b> <button onclick="copy(\'5240879532\')">Copy account number</button></div><div class="bank"><b>SMART CHOICE GLOBAL RESOURCES LIMITED</b><br>Sterling Bank PLC<br>Account: <b>0142262389</b> <button onclick="copy(\'0142262389\')">Copy account number</button></div><small>Do not treat a transfer as an order confirmation yet. Automated bank verification and proof-of-payment submission must be connected before online payment can be safely completed. Contact the showroom to confirm your order.</small>'}function copy(v){navigator.clipboard?.writeText(v).then(()=>alert('Account number copied')).catch(()=>alert(v))}load();</script></body></html>
