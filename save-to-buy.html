<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#182238;font:15px Arial}header{background:#071b4a;color:#fff;padding:15px}header a{color:#fff;text-decoration:none;font-weight:bold;margin-right:15px}.wrap{max-width:850px;margin:25px auto;padding:0 16px}h1,h2{color:#071b4a}.panel{background:white;border-radius:12px;padding:20px;margin:15px 0}.muted{color:#667085;line-height:1.6}.field{width:100%;padding:12px;border:1px solid #d5dae4;border-radius:7px;margin:8px 0}.btn{background:#e51d3e;color:#fff;border:0;border-radius:7px;padding:12px 16px;font-weight:bold;display:inline-block;text-decoration:none}.choice{display:block;padding:14px;border:1px solid #dce1e9;border-radius:8px;margin:9px 0}.bank{background:#f5f7fb;padding:13px;border-radius:8px;margin:10px 0}footer{background:#071b4a;color:#fff;padding:22px;margin-top:30px}small{color:#667085}<title>Save to Buy | Smart Choice</title></head><body><header><a href="/">SMART CHOICE ELECTRONICS GROUP</a>　<a href="/shop.html">Shop</a>　<a href="/cart.html">Cart</a></header><main class="wrap"><h1>Save to Buy</h1><p class="muted">Choose a payment duration and frequency that works for you. You will receive the product only after all scheduled payments have been completed and confirmed.</p><div class="panel"><h2 id="product">Your selected product</h2><label>Product price (₦)</label><input id="price" class="field" type="number" min="1" placeholder="Enter product price" oninput="calculate()"><label>Payment duration</label><select id="duration" class="field" onchange="calculate()"><option value="1">1 month</option><option value="2">2 months</option><option value="3">3 months</option><option value="4">4 months</option></select><label>Payment frequency</label><select id="frequency" class="field" onchange="calculate()"><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select><div class="panel" style="background:#f5f7fb"><p>Save to Buy interest rate: <b id="rate">3%</b></p><h2>Total payable: <span id="total">₦0</span></h2><p>Estimated instalment: <b id="installment">₦0</b></p><p id="count" class="muted"></p></div><label><input type="checkbox" id="agree"> I understand that the product will only be released after all payments are completed and confirmed.</label><p><button class="btn" onclick="startPlan()">Continue with Save to Buy</button></p><p id="msg" class="muted"></p></div><div class="panel"><h3>How Save to Buy works</h3><ol><li>Select a product and enter its price.</li><li>Choose a plan from 1 to 4 months.</li><li>Choose weekly or monthly payments.</li><li>Make each scheduled deposit.</li><li>Collect your product after the full balance is paid and verified.</li></ol></div></main><footer>Smart Choice Electronics Group · Port Harcourt only</footer><script>
const params=new URLSearchParams(location.search);document.getElementById('product').textContent=params.get('product')||'Your selected product';function calculate(){let d=+duration.value,p=+price.value||0,r=d===1?3:d===2?5:7,n=frequency.value==='weekly'?d*4:d;let total=p*(1+r/100);document.getElementById('rate').textContent=r+'%';document.getElementById('total').textContent='₦'+Math.round(total).toLocaleString('en-NG');document.getElementById('installment').textContent='₦'+Math.ceil(total/n).toLocaleString('en-NG');document.getElementById('count').textContent=n+' scheduled '+frequency.value+' payment(s)';}function startPlan(){if(!(+price.value>0)){msg.textContent='Please enter the product price.';return}if(!agree.checked){msg.textContent='Please confirm that you understand the product release condition.';return}msg.textContent='Your plan calculation is ready. Saving a plan and scheduling payments requires the customer account and database service to be connected. Please contact the showroom to arrange this plan for now.';}calculate();</script></body></html>
